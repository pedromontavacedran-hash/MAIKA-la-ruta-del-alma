<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAIKA</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(ellipse at center, #2a1a38 0%, #120a18 70%);
        color: #f5e6a3;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.65rem;
        letter-spacing: 0.12em;
        color: #d4af37;
        text-shadow: 0 0 18px rgba(212, 175, 55, 0.45);
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        opacity: 0.88;
      }
      .pulse {
        margin-top: 22px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d4af37;
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
    </style>
  </head>
  <body>
    <h1>MAIKA</h1>
    <p>Rutas del Alma</p>
    <p style="margin-top: 8px; font-size: 0.85rem">Preparando la experiencia…</p>
    <div class="pulse" aria-hidden="true"></div>
  </body>
</html>
